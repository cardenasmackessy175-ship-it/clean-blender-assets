    else{el=document.createElement('img');el.alt=r[0];el.src=kind==='preview'?M+'full/'+r[0]+'.webp?v='+r[7]:M+'v/'+r[0]+'_'+kind+'.webp?v='+r[7];}
    stage.appendChild(el);[].forEach.call(views.children,function(x){x.className=x===btn?'on':'';});
  }
  function open(i){
    if(i<0||i>=order.length)return;at=i;var r=tiles[order[i]]._b._r;views.textContent='';
    var kinds=(r[5]?['anim']:[]).concat(['preview']).concat(VN.filter(function(v,k){return r[6]>>k&1;}));
    kinds.forEach(function(k){var b=document.createElement('button');b.type='button';b.setAttribute('aria-label',k);
      if(k==='anim')b.textContent='▶';else b.style.backgroundImage='url("'+(k==='preview'?M+'full/'+r[0]+'.webp?v='+r[7]:M+'v/'+r[0]+'_'+k+'.webp?v='+r[7])+'")';
      b.addEventListener('click',function(){show(k,r,b);});views.appendChild(b);});
    views.style.display=kinds.length>1?'flex':'none';
    cap.innerHTML='';var b=document.createElement('b');b.textContent=r[0];cap.appendChild(b);cap.appendChild(document.createTextNode('  '+(D.c[r[2]]||r[2])+'  '+r[1]+(r[11]?'  '+r[11]:'')));
    show(kinds[0],r,views.children[0]);lb.className='open';document.body.style.overflow='hidden';document.getElementById('close').focus();
  }
  function shut(){lb.className='';stage.textContent='';document.body.style.overflow='';if(at>=0&&tiles[order[at]])tiles[order[at]]._b.focus();at=-1;}
  document.getElementById('close').onclick=shut;document.getElementById('prev').onclick=function(){open(at-1);};document.getElementById('next').onclick=function(){open(at+1);};
  lb.addEventListener('click',function(e){if(e.target===lb||e.target===stage)shut();});
  document.addEventListener('keydown',function(e){if(lb.className!=='open')return;if(e.key==='Escape')shut();else if(e.key==='ArrowLeft')open(at-1);else if(e.key==='ArrowRight')open(at+1);});
  // Export list: the assets of this page as a tab-separated file, same layout as blender_assets/clean_assets.tsv plus category and cleaned
  document.getElementById('export').addEventListener('click',function(){
    var cell=function(x){return String(x).replace(/[\t\r\n]+/g,' ');};
    var lines=[['编号','资产类型','网站来源','源站ID','分类','已清洗','资产目录'].join('\t')];
    D.t.forEach(function(r){lines.push([r[0],r[8]?'dynamic':'static',r[1],r[11]||'',D.c[r[2]]||r[2],r[9]?'是':'否',r[10]?D.r+'/'+r[10]:''].map(cell).join('\t'));});
    var part=location.pathname.split('/').filter(Boolean),at=Math.max(part.indexOf('total'),part.indexOf('clean'));
    var name=(at<0?['total']:part.slice(at)).map(decodeURIComponent).join('_').replace(/[^\w.-]+/g,'-');
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines.join('\n')+'\n'],{type:'text/tab-separated-values;charset=utf-8'}));
    a.download='blender_assets_'+name+'.tsv';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
  });
  draw(document.getElementById('tiles').textContent,false);
  function refresh(){
    if(document.hidden||lb.className==='open')return;
    fetch(location.pathname,{cache:'no-store'}).then(function(r){return r.ok?r.text():null;}).then(function(h){
      if(!h)return;var m=h.match(/<script id="tiles" type="application\/json">([\s\S]*?)<\/script>/);

    }).catch(function(){});
  }
  setInterval(refresh,30000);document.addEventListener('visibilitychange',refresh);
})();
