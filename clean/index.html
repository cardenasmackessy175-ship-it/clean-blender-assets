    var cell=function(x){return String(x).replace(/[\t\r\n]+/g,' ');};
    var lines=[['编号','资产类型','网站来源','源站ID','分类','已清洗','资产目录'].join('\t')];
    D.t.forEach(function(r){lines.push([r[0],r[8]?'dynamic':'static',r[1],r[11]||'',D.c[r[2]]||r[2],r[9]?'是':'否',r[10]?D.r+'/'+r[10]:''].map(cell).join('\t'));});
    var part=location.pathname.split('/').filter(Boolean),at=Math.max(part.indexOf('total'),part.indexOf('clean'));
    var name=(at<0?['total']:part.slice(at)).map(decodeURIComponent).join('_').replace(/[^\w.-]+/g,'-');
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines.join('\n')+'\n'],{type:'text/tab-separated-values;charset=utf-8'}));
    a.download='blender_assets_'+name+'.tsv';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
  });
  draw(document.getElementById('tiles').textContent,false);
  function refresh(){
    if(document.hidden||lb.className==='open')return;
    fetch(location.pathname,{cache:'no-store'}).then(function(r){return r.ok?r.text():null;}).then(function(h){
      if(!h)return;var m=h.match(/<script id="tiles" type="application\/json">([\s\S]*?)<\/script>/);
      if(m&&m[1]!==shown)draw(m[1],true);
    }).catch(function(){});
  }
  setInterval(refresh,30000);document.addEventListener('visibilitychange',refresh);
})();
</script>
